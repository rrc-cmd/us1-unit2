<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var SEC = D.sections, byId = {};
  SEC.forEach(function(s){ byId[s.id] = s; });
  var app = document.getElementById('app');
  var LET = ['A','B','C','D','E'];
  var state = { view:'home', answered:{}, quiz:{}, test:null, fc:{filter:'all', order:[], i:0} };

  function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function applyColors(root){
    root.querySelectorAll('[data-color]').forEach(function(el){ el.style.setProperty('--c', el.getAttribute('data-color')); });
    root.querySelectorAll('img[data-img]').forEach(function(el){ var k = el.getAttribute('data-img'); if (D.images[k]) el.src = D.images[k]; });
  }

  function renderSecbar(){
    var bar = document.getElementById('secbar');
    var inLearn = /^s\d$/.test(state.view);
    if (!inLearn){ bar.innerHTML=''; bar.style.display='none'; return; }
    bar.style.display='flex';
    bar.innerHTML = SEC.map(function(s){
      return '<button data-go="'+s.id+'" data-color="'+s.color+'" class="'+(state.view===s.id?'on':'')+'">'+s.num+'. '+esc(s.title)+'</button>';
    }).join('');
    applyColors(bar);
    var on = bar.querySelector('.on'); if (on) bar.scrollLeft = on.offsetLeft - 20;
  }
  function setNav(){
    document.querySelectorAll('.nav button').forEach(function(b){
      var g=b.getAttribute('data-go'), v=state.view;
      var on = (g==='home'&&v==='home')||(g==='s1'&&/^s\d$/.test(v))||(g==='cards'&&v==='cards')||(g==='tests'&&(v==='tests'||v.indexOf('test')===0));
      b.classList.toggle('on', on);
    });
  }

  /* ---------- question rendering ---------- */
  function qHTML(q, id, label, mode){
    // mode: 'instant' or 'test'
    var h = '<div class="q" data-qid="'+id+'">';
    if (label) h += '<div class="lab">'+esc(label)+'</div>';
    h += '<div class="stem">'+esc(q.q)+'</div><div class="opts">';
    q.c.forEach(function(c,i){
      h += '<button class="opt" data-mode="'+mode+'" data-qid="'+id+'" data-i="'+i+'"><span class="l">'+LET[i]+'</span><span>'+esc(c)+'</span></button>';
    });
    h += '</div><div class="fbwrap"></div></div>';
    return h;
  }
  function findQ(id){
    var p = id.split('|'); // kind|sec|idx
    var s = byId[p[1]];
    if (p[0]==='ck') return s.lessons[+p[2]].check;
    if (p[0]==='qz') return s.quiz[+p[2]];
    return null;
  }
  function showInstant(box, q, pick){
    var btns = box.querySelectorAll('.opt');
    btns.forEach(function(b,i){ b.disabled = true; if (i===q.a) b.classList.add('right'); else if (i===pick) b.classList.add('wrong'); });
    var ok = pick===q.a;
    box.querySelector('.fbwrap').innerHTML = '<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'Correct.':'Not quite — the answer is '+LET[q.a]+'.')+'</b> '+esc(q.e)+'</div>';
  }

  /* ---------- views ---------- */
  function viewHome(){
    var M = D.meta;
    var h = '<section class="hero"><h1>'+esc(M.heading)+'</h1><p class="sub">'+M.sub+'</p>';
    h += '<div class="road" style="--grad:'+M.grad+'"><div class="road-years"><span>'+esc(M.y0)+'</span><span>'+esc(M.y1)+'</span></div><div class="stops">';
    SEC.forEach(function(s){
      h += '<button class="stop" data-go="'+s.id+'" data-color="'+s.color+'"><span class="n">'+s.num+'</span><span class="t">'+esc(s.title)+'</span><span class="y">'+esc(s.years)+'</span></button>';
    });
    h += '</div></div></section>';
    h += '<div class="panel"><h2>How to use this guide</h2><p>'+M.howto+'</p></div>';
    h += '<div class="panel"><h2>'+esc(M.termsTitle)+'</h2><p class="muted">'+esc(M.termsSub)+'</p><div class="terms">';
    D.cards.filter(function(c){return c.key;}).forEach(function(c){
      h += '<button class="term" data-go="'+c.sec+'" data-color="'+byId[c.sec].color+'">'+esc(c.term)+'</button>';
    });
    h += '</div></div>';
    if (M.extraPanel) h += '<div class="panel">'+M.extraPanel+'</div>';
    app.innerHTML = h;
  }

  function viewSection(id){
    var s = byId[id], idx = SEC.indexOf(s);
    var h = '<div data-color="'+s.color+'">';
    h += '<div class="sechead"><div class="k">Section '+s.num+' &nbsp; '+esc(s.years)+'</div><h1>'+esc(s.title)+'</h1><div class="src">Class material: '+esc(s.source)+'</div></div>';
    if (s.flag) h += '<div class="flag">'+s.flag+'</div>';
    h += '<p>'+esc(s.intro)+'</p>';
    s.lessons.forEach(function(L,i){
      h += '<article class="lesson"><div class="lesson-h"><span class="n">'+(i+1)+'</span><h2>'+esc(L.title)+'</h2><span class="when">'+esc(L.when)+'</span></div><div class="lesson-b">'+L.html;
      h += qHTML(L.check, 'ck|'+id+'|'+i, 'Check-in', 'instant');
      h += '</div></article>';
    });
    h += '<div class="quizbox"><h2>Section '+s.num+' quiz</h2><p class="muted">'+s.quiz.length+' questions. Answers are checked as you go.</p>';
    s.quiz.forEach(function(q,i){ h += qHTML(q, 'qz|'+id+'|'+i, 'Question '+(i+1), 'instant'); });
    h += '<div class="score" id="qscore"></div></div>';
    h += '<div class="pager">';
    h += idx>0 ? '<button class="btn" data-go="'+SEC[idx-1].id+'">Back: '+esc(SEC[idx-1].title)+'</button>' : '<span></span>';
    h += idx<SEC.length-1 ? '<button class="btn primary" data-go="'+SEC[idx+1].id+'">Next: '+esc(SEC[idx+1].title)+'</button>' : '<button class="btn primary" data-go="cards">Go to flashcards</button>';
    h += '</div></div>';
    app.innerHTML = h;
    // restore answered
    Object.keys(state.answered).forEach(function(k){
      var box = app.querySelector('.q[data-qid="'+k+'"]');
      if (box) showInstant(box, findQ(k), state.answered[k]);
    });
    updateQuizScore(id);
  }
  function updateQuizScore(id){
    var s = byId[id], el = document.getElementById('qscore'); if (!el) return;
    var n=0, r=0;
    s.quiz.forEach(function(q,i){ var k='qz|'+id+'|'+i; if (k in state.answered){ n++; if (state.answered[k]===q.a) r++; } });
    el.textContent = n===s.quiz.length ? 'Score: '+r+' / '+n+(r===n?' — perfect.':' — reread the lessons for any you missed, then try the flashcards.') : '';
  }

  /* flashcards */
  function fcList(){
    var f = state.fc.filter;
    return D.cards.map(function(c,i){return i;}).filter(function(i){
      var c = D.cards[i];
      if (f==='all') return true;
      if (f==='key') return c.key;
      return c.sec===f;
    });
  }
  function fcReset(shuffle){
    var l = fcList();
    if (shuffle){ for (var i=l.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=l[i]; l[i]=l[j]; l[j]=t; } }
    state.fc.order = l; state.fc.i = 0;
  }
  function viewCards(){
    if (!state.fc.order.length) fcReset(false);
    var h = '<div class="sechead" data-color="#c9a45c"><div class="k">Flashcards</div><h1>'+esc(D.meta.cardsTitle)+'</h1><div class="src">Tap the card (or press space) to flip. Arrow keys move between cards.</div></div>';
    h += '<div class="fc-controls"><select id="fcfilter" aria-label="Choose cards"><option value="all">All cards ('+D.cards.length+')</option><option value="key">MCQ study-guide terms only ('+D.cards.filter(function(c){return c.key;}).length+')</option>';
    SEC.forEach(function(s){ h += '<option value="'+s.id+'">Section '+s.num+': '+esc(s.title)+'</option>'; });
    h += '</select><button class="btn" data-act="fc-shuffle">Shuffle</button></div><div id="fcwrap"></div>';
    app.innerHTML = h;
    document.getElementById('fcfilter').value = state.fc.filter;
    drawCard();
  }
  function drawCard(){
    var w = document.getElementById('fcwrap'); if (!w) return;
    var o = state.fc.order; if (!o.length){ w.innerHTML='<p>No cards in this set.</p>'; return; }
    var c = D.cards[o[state.fc.i]], s = byId[c.sec];
    var h = '<div class="card" id="card" data-color="'+s.color+'" tabindex="0" role="button" aria-label="Flip card"><div class="card-in">';
    h += '<div class="face front">'+(c.key?'<span class="badge">Key term</span>':'')+'<div class="term-t">'+esc(c.term)+'</div><div class="d">'+esc(c.date)+'</div><div class="s">Section '+s.num+': '+esc(s.title)+'</div><div class="hint">Tap to flip</div></div>';
    h += '<div class="face back"><h3>'+esc(c.term)+'</h3><div class="fgrid">';
    c.fields.forEach(function(f){ h += '<div><span class="h">'+esc(f[0])+'</span>'+esc(f[1])+'</div>'; });
    h += '</div></div></div></div>';
    h += '<div class="fc-count">Card '+(state.fc.i+1)+' of '+o.length+'</div>';
    h += '<div class="fc-nav"><button class="btn" data-act="fc-prev">Previous</button><button class="btn" data-act="fc-flip">Flip</button><button class="btn primary" data-act="fc-next">Next</button></div>';
    w.innerHTML = h; applyColors(w);
  }

  /* tests */
  function viewTests(){
    var h = '<div class="sechead" data-color="#c9a45c"><div class="k">Practice tests</div><h1>Three '+D.tests[0].length+'-question tests</h1><div class="src">Multiple choice, like the real test. Answer everything, then submit to see your score by section.</div></div><div class="tests">';
    D.tests.forEach(function(t,i){
      h += '<button class="testcard" data-act="test-start" data-t="'+i+'"><div class="n">Test '+(i+1)+'</div><div>'+t.length+' questions covering all '+SEC.length+' sections</div></button>';
    });
    h += '</div>';
    app.innerHTML = h;
  }
  function viewTest(ti){
    var T = D.tests[ti];
    if (!state.test || state.test.t!==ti) state.test = {t:ti, picks:{}, done:false};
    var h = '<div class="sechead" data-color="#c9a45c"><div class="k">Practice test '+(ti+1)+'</div><h1>'+T.length+' questions</h1><div class="src">Pick one answer for each question, then submit.</div></div><div id="tres"></div>';
    T.forEach(function(q,i){
      var s = byId[q.s];
      h += '<div data-color="'+s.color+'">'+qHTML(q, 'ts|'+ti+'|'+i, 'Question '+(i+1)+'  (Section '+s.num+')', 'test')+'</div>';
    });
    h += '<div class="sticky-submit"><button class="btn primary" data-act="test-submit">Submit test</button></div>';
    h += '<div class="pager"><button class="btn" data-go="tests">All practice tests</button></div>';
    app.innerHTML = h;
    Object.keys(state.test.picks).forEach(function(i){
      var b = app.querySelector('.opt[data-qid="ts|'+ti+'|'+i+'"][data-i="'+state.test.picks[i]+'"]'); if (b) b.classList.add('sel');
    });
    if (state.test.done) gradeTest();
  }
  function gradeTest(){
    var ti = state.test.t, T = D.tests[ti], per = {}, right = 0;
    var unanswered = T.filter(function(q,i){ return !(i in state.test.picks); }).length;
    if (unanswered && !state.test.done){
      var ok = window.confirm(unanswered+' question'+(unanswered>1?'s are':' is')+' unanswered. Submit anyway?');
      if (!ok) return;
    }
    state.test.done = true;
    T.forEach(function(q,i){
      per[q.s] = per[q.s] || {r:0,n:0}; per[q.s].n++;
      var pick = state.test.picks[i], box = app.querySelector('.q[data-qid="ts|'+ti+'|'+i+'"]');
      if (pick===q.a){ right++; per[q.s].r++; }
      box.querySelectorAll('.opt').forEach(function(b,j){ b.disabled=true; b.classList.remove('sel'); if (j===q.a) b.classList.add('right'); else if (j===pick) b.classList.add('wrong'); });
      box.querySelector('.fbwrap').innerHTML = '<div class="fb '+(pick===q.a?'good':'bad')+'"><b>'+(pick===q.a?'Correct.':(pick===undefined?'Not answered — ':'Incorrect — ')+'the answer is '+LET[q.a]+'.')+'</b> '+esc(q.e)+'</div>';
    });
    var pct = Math.round(100*right/T.length);
    var h = '<div class="results"><div class="big">'+right+' / '+T.length+'</div><div>'+pct+'%. Tap a section below to review it.</div><div class="brk">';
    SEC.forEach(function(s){ if (per[s.id]) h += '<button data-go="'+s.id+'" data-color="'+s.color+'">Section '+s.num+': '+per[s.id].r+' / '+per[s.id].n+'<br><span class="muted">'+esc(s.title)+'</span></button>'; });
    h += '</div><div class="pager"><button class="btn" data-act="test-retry">Retake this test</button><button class="btn" data-go="tests">All practice tests</button></div></div>';
    var res = document.getElementById('tres'); res.innerHTML = h; applyColors(res);
    var sb = app.querySelector('.sticky-submit'); if (sb) sb.style.display='none';
    res.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function go(v){
    state.view = v;
    if (v==='home') viewHome();
    else if (/^s\d$/.test(v)) viewSection(v);
    else if (v==='cards') viewCards();
    else if (v==='tests') viewTests();
    else if (v.indexOf('test')===0) viewTest(+v.slice(4));
    applyColors(app); renderSecbar(); setNav();
    window.scrollTo(0,0);
  }

  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-go]');
    if (g){ go(g.getAttribute('data-go')); return; }
    var o = e.target.closest('.opt');
    if (o && !o.disabled){
      var id = o.getAttribute('data-qid'), i = +o.getAttribute('data-i');
      if (o.getAttribute('data-mode')==='instant'){
        if (id in state.answered) return;
        state.answered[id] = i;
        showInstant(o.closest('.q'), findQ(id), i);
        var p = id.split('|'); if (p[0]==='qz') updateQuizScore(p[1]);
      } else {
        var qi = +id.split('|')[2];
        state.test.picks[qi] = i;
        o.closest('.opts').querySelectorAll('.opt').forEach(function(b){ b.classList.remove('sel'); });
        o.classList.add('sel');
      }
      return;
    }
    var a = e.target.closest('[data-act]');
    if (a){
      var act = a.getAttribute('data-act');
      if (act==='fc-next'){ state.fc.i = (state.fc.i+1)%state.fc.order.length; drawCard(); }
      else if (act==='fc-prev'){ state.fc.i = (state.fc.i-1+state.fc.order.length)%state.fc.order.length; drawCard(); }
      else if (act==='fc-flip'){ var c=document.getElementById('card'); if (c) c.classList.toggle('flipped'); }
      else if (act==='fc-shuffle'){ fcReset(true); drawCard(); }
      else if (act==='test-start'){ state.test=null; go('test'+a.getAttribute('data-t')); }
      else if (act==='test-submit'){ gradeTest(); }
      else if (act==='test-retry'){ var t=state.test.t; state.test=null; go('test'+t); }
      return;
    }
    var card = e.target.closest('#card');
    if (card) card.classList.toggle('flipped');
  });
  document.addEventListener('change', function(e){
    if (e.target.id==='fcfilter'){ state.fc.filter = e.target.value; fcReset(false); drawCard(); }
  });
  document.addEventListener('keydown', function(e){
    if (state.view!=='cards' || e.target.tagName==='SELECT') return;
    if (e.key==='ArrowRight'){ state.fc.i=(state.fc.i+1)%state.fc.order.length; drawCard(); }
    else if (e.key==='ArrowLeft'){ state.fc.i=(state.fc.i-1+state.fc.order.length)%state.fc.order.length; drawCard(); }
    else if (e.key===' ' || e.key==='Enter'){ var c=document.getElementById('card'); if (c){ e.preventDefault(); c.classList.toggle('flipped'); } }
  });

  document.getElementById('brand').textContent = D.meta.brand;
  document.querySelector('.road') ;
  go('home');
})();
</script>
</body>
</html>
